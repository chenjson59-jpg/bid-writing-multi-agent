name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 代码检查
        run: uv run ruff check api src tests scripts eval

      - name: 离线测试
        run: uv run pytest -q

      - name: Golden Data 离线评测（T-020/T-021，抽取链）
        run: uv run python -m eval.harness.runner

      - name: 编写阶段离线评测（T-022，A/B 冻结基线）
        run: uv run python -m eval.harness.writing_runner

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
