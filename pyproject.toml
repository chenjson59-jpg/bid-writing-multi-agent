[project]
name = "bidding"
version = "0.1.0"
description = "招标文件多智能体系统"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "openai>=3.32.0",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

# 默认使用清华 PyPI 镜像，网络更稳
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
